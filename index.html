<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Cuaderno de Bitácora</title>
<meta name="theme-color" content="#A3402C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!-- Firebase (opcional): rellena tu configuración más abajo en el <script> para que
     los diarios se compartan de verdad entre dispositivos. Si no lo rellenas, la app
     sigue funcionando pero cada dispositivo guarda sus diarios por separado. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper: #EFE3C6;
    --paper-light: #F9F1DC;
    --paper-dark: #E3D3AC;
    --ink: #3A2E20;
    --ink-soft: #6b5a44;
    --stamp-red: #A3402C;
    --map-teal: #33585A;
    --gold: #B5893F;
    --shadow: rgba(58, 46, 32, 0.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; overscroll-behavior-y: contain;}
  body{
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.25), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(0,0,0,0.06), transparent 55%),
      var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family:'Lora', serif;
    min-height:100%;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(90deg, rgba(58,46,32,0.015) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(0deg, rgba(58,46,32,0.015) 0px, transparent 1px, transparent 3px);
    z-index:0;
  }
  #app{position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:40px;}
  /* Grano de papel/foto antigua, muy sutil, por encima de todo el contenido */
  .grain-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:4;
    opacity:0.05; mix-blend-mode:multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  @media (prefers-reduced-motion: reduce){
    .grain-overlay{ opacity:0.03; }
  }
  .dust-motes{ position:fixed; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
  .dust-mote{
    position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
    background:radial-gradient(circle, rgba(197,164,103,0.55), transparent 70%);
    animation: driftUp linear infinite;
  }
  .dust-mote:nth-child(1){ left:12%; width:4px; height:4px; animation-duration:26s; animation-delay:0s; }
  .dust-mote:nth-child(2){ left:32%; animation-duration:34s; animation-delay:-6s; }
  .dust-mote:nth-child(3){ left:55%; width:5px; height:5px; animation-duration:22s; animation-delay:-14s; }
  .dust-mote:nth-child(4){ left:74%; animation-duration:30s; animation-delay:-3s; }
  .dust-mote:nth-child(5){ left:88%; width:3px; height:3px; animation-duration:38s; animation-delay:-20s; }
  @keyframes driftUp{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:0.5; }
    50%{ transform:translate(14px,-52vh); opacity:0.35; }
    90%{ opacity:0.15; }
    100%{ transform:translate(-10px,-104vh); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .dust-motes{ display:none; }
  }

  h1,h2,h3{font-family:'Caveat', cursive; font-weight:700; margin:0; color:var(--ink);}
  .stamp-label{font-family:'Special Elite', monospace; letter-spacing:0.06em; text-transform:uppercase; font-size:11px; color:var(--ink-soft);}

  /* ---- Top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 10px;
  }
  .topbar .brand{display:flex; align-items:center; gap:10px;}
  .topbar .brand .mark{
    width:34px; height:34px; border-radius:50%;
    background:var(--stamp-red); color:var(--paper-light);
    display:flex; align-items:center; justify-content:center;
    font-family:'Caveat'; font-weight:700; font-size:20px;
    box-shadow: 0 2px 4px var(--shadow);
    transform: rotate(-6deg);
  }
  .topbar h1{font-size:26px;}
  .back-btn, .icon-btn{
    background:none; border:none; font-family:'Special Elite';
    color:var(--ink-soft); font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:4px; padding:6px 4px;
  }

  /* ---- Buttons ---- */
  .btn{
    font-family:'Special Elite', monospace; font-size:13px; letter-spacing:0.03em;
    text-transform:uppercase; text-align:center;
    padding:13px 18px; border-radius:3px; border:1px solid var(--ink);
    background:var(--paper-light); color:var(--ink);
    cursor:pointer; width:100%;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .08s ease;
  }
  .btn:active{ transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  .btn-primary{ background:var(--stamp-red); color:var(--paper-light); border-color:var(--stamp-red); box-shadow:2px 2px 0 #6b2013;}
  .btn-primary:active{box-shadow:0 0 0 #6b2013;}
  .btn-teal{ background:var(--map-teal); color:var(--paper-light); border-color:var(--map-teal); box-shadow:2px 2px 0 #1c3536;}
  .btn-teal:active{box-shadow:0 0 0 #1c3536;}
  .btn-ghost{ background:transparent; box-shadow:none; border:1px dashed var(--ink-soft); color:var(--ink-soft);}
  .btn-ghost:active{transform:none;}
  .btn-row{display:flex; gap:10px;}

  input, textarea{
    font-family:'Lora', serif; font-size:15px;
    width:100%; padding:12px 12px; border-radius:2px;
    border:none; border-bottom:2px solid var(--ink-soft);
    background: rgba(255,255,255,0.35);
    color:var(--ink); outline:none;
  }
  input:focus, textarea:focus{ border-bottom-color:var(--stamp-red); background: rgba(255,255,255,0.55);}
  label.field-label{display:block; font-family:'Special Elite'; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:14px 0 6px;}

  .screen{padding:6px 20px 30px; animation: fadeIn .35s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---- Login ---- */
  .login-wrap{ min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
  .cover-card{
    width:100%; max-width:340px; background:var(--paper-light);
    border:1px solid var(--ink-soft); border-radius:2px;
    padding:34px 26px; text-align:center;
    box-shadow: 0 8px 0 -3px var(--paper-dark), 0 10px 18px var(--shadow);
    position:relative;
  }
  .cover-card::after{
    content:"✈ ⛺ ⚓";
    display:block; margin-top:6px; letter-spacing:10px; color:var(--gold); font-size:13px;
  }
  .cover-card h1{font-size:40px; line-height:1.05; margin-bottom:6px;}
  .cover-card p{color:var(--ink-soft); font-size:14px; margin:4px 0 22px;}
  .cover-card input{margin-bottom:14px; text-align:center;}

  /* ---- Book shelf (real bookshelf look) ---- */
  .shelf-wrap{
    background:
      linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 35%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0px, transparent 2px, transparent 7px, rgba(0,0,0,0.035) 9px),
      repeating-linear-gradient(89deg, rgba(255,255,255,0.03) 0px, transparent 3px, transparent 40px),
      linear-gradient(180deg, #8a6540 0%, #6e4e2e 100%);
    border-radius: 6px;
    padding: 20px 12px 6px;
    margin-bottom: 4px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.3), inset 0 -2px 3px rgba(255,255,255,0.06), 0 4px 10px rgba(0,0,0,0.18);
    perspective: 700px;
  }
  .shelf-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    grid-auto-rows: 148px;
    gap: 0 11px;
    align-items:end;
    position:relative;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 148px,
      #4a3119 148px, #3c2712 157px,
      rgba(0,0,0,0.3) 157px, rgba(0,0,0,0.3) 160px,
      transparent 160px, transparent 176px
    );
  }
  .book-spine{
    height:136px; border-radius:4px 4px 2px 2px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:10px 4px 8px; position:relative;
    background-image: linear-gradient(90deg, rgba(255,255,255,0.16), transparent 18%, transparent 82%, rgba(0,0,0,0.18));
    box-shadow: 1px 0 0 rgba(255,255,255,0.15) inset, -2px 0 4px rgba(0,0,0,0.25),
      3px 8px 10px rgba(0,0,0,0.4);
    transform: perspective(700px) rotateY(var(--tiltY,0deg)) rotate(var(--tilt, 0deg));
    transform-origin: bottom center;
    align-self:end;
    transition: transform .18s ease, box-shadow .18s ease;
    animation: spineEnter .38s ease backwards;
    animation-delay: var(--delay, 0ms);
  }
  .book-spine:active{ transform: perspective(700px) rotateY(0deg) rotate(0deg) translateY(-6px) scale(1.05); box-shadow: 2px 10px 16px rgba(0,0,0,0.45); }
  .book-spine.pulling{ animation: bookPull .32s ease forwards; }
  .book-spine .spine-icon{ font-size:15px; margin-bottom:6px; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3)); }
  .book-spine .spine-title{
    writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
    font-family:'Caveat'; font-weight:700; font-size:16px; color:#EAD08C;
    max-height:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-shadow: 0 1px 0 rgba(0,0,0,0.55), 0 -1px 0 rgba(255,255,255,0.18);
  }
  /* ---- Material de cuero/tela encuadernada, con marco dorado tipo gofrado ---- */
  .leather-texture{
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.07) 0px, rgba(0,0,0,0.07) 1px, transparent 1px, transparent 4px),
      radial-gradient(ellipse at 28% 15%, rgba(255,255,255,0.14), transparent 55%),
      radial-gradient(ellipse at 82% 92%, rgba(0,0,0,0.22), transparent 55%);
    position:relative;
  }
  .leather-texture::before{
    content:""; position:absolute; inset:5px; border:1px solid rgba(234,208,140,0.4);
    border-radius:2px; pointer-events:none;
  }
  .book-cover-face.leather-texture::before{ inset:16px; border-width:2px; border-radius:4px; }
  .book-spine .spine-band{
    position:absolute; left:3px; right:3px; height:3px; background:rgba(255,255,255,0.35); border-radius:2px;
  }
  .book-spine .spine-band.top{ top:26px; }
  .book-spine .spine-band.bottom{ bottom:10px; }
  @keyframes spineEnter{
    from{ opacity:0; transform: perspective(700px) rotateY(var(--tiltY,0deg)) rotate(var(--tilt,0deg)) translateY(14px); }
    to{ opacity:1; transform: perspective(700px) rotateY(var(--tiltY,0deg)) rotate(var(--tilt,0deg)) translateY(0); }
  }
  @keyframes bookPull{
    0%{ transform: perspective(700px) rotateY(var(--tiltY,0deg)) rotate(var(--tilt,0deg)) translateY(0) scale(1); }
    50%{ transform: perspective(700px) rotateY(0deg) rotate(0deg) translateY(-16px) scale(1.08); }
    100%{ transform: perspective(700px) rotateY(0deg) rotate(0deg) translateY(-6px) scale(1.02); opacity:0.7; }
  }
  .shelf-empty{
    grid-column: 1 / -1; text-align:center; padding:30px 16px;
    font-family:'Caveat'; font-size:22px; color:rgba(255,255,255,0.85);
  }

  /* ---- Apertura de la tapa del libro en 3D al abrir un diario ---- */
  .book-cover-overlay{
    position:fixed; inset:0; z-index:70; perspective:1400px;
    pointer-events:none;
  }
  .book-cover-face{
    position:absolute; inset:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    transform-origin:left center; transform-style:preserve-3d; backface-visibility:hidden;
    box-shadow: 10px 0 30px rgba(0,0,0,0.45);
    transition: transform .52s cubic-bezier(.45,0,.2,1), box-shadow .52s ease;
    background-image:
      linear-gradient(115deg, rgba(255,255,255,0.16) 0%, transparent 30%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0px, transparent 2px, transparent 8px);
  }
  .book-cover-face .cover-icon{ font-size:56px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4)); }
  .book-cover-face .cover-title{
    font-family:'Caveat'; font-weight:700; font-size:32px; color:#EAD08C;
    text-shadow:0 2px 0 rgba(0,0,0,0.5), 0 -1px 0 rgba(255,255,255,0.2); max-width:78%; text-align:center; line-height:1.1;
  }
  .book-cover-face .cover-line{ width:64px; height:2px; background:rgba(255,255,255,0.55); }
  .book-cover-face .cover-corner{
    position:absolute; width:26px; height:26px; border:2px solid rgba(255,255,255,0.35);
  }
  .book-cover-face .cover-corner.tl{ top:16px; left:16px; border-right:none; border-bottom:none; }
  .book-cover-face .cover-corner.br{ bottom:16px; right:16px; border-left:none; border-top:none; }
  .book-cover-overlay.opening .book-cover-face{
    transform: rotateY(-98deg);
    box-shadow: 40px 0 50px rgba(0,0,0,0.18);
  }
  @media (prefers-reduced-motion: reduce){
    .book-cover-face{ transition:none; }
  }
  .page-edge{
    position:fixed; top:0; bottom:0; right:calc(50% - 260px); width:5px;
    background: repeating-linear-gradient(to bottom,
      rgba(58,46,32,0.16) 0px, rgba(58,46,32,0.16) 2px,
      rgba(200,180,140,0.25) 2px, rgba(200,180,140,0.25) 3px,
      transparent 3px, transparent 6px);
    pointer-events:none; z-index:2; opacity:0.75;
  }
  @media (max-width:560px){
    .page-edge{ right:2px; }
  }
  .ink-stamp{
    position:fixed; top:38%; left:50%; z-index:65; pointer-events:none;
    transform:translate(-50%,-50%) rotate(-9deg) scale(2.2); opacity:0;
    font-family:'Special Elite'; font-size:24px; color:var(--stamp-red);
    border:4px solid var(--stamp-red); padding:9px 20px; border-radius:6px;
    text-transform:uppercase; letter-spacing:3px; background:rgba(249,241,220,0.08);
    animation: stampThud .85s cubic-bezier(.2,1.5,.4,1) forwards;
  }
  @keyframes stampThud{
    0%{ opacity:0; transform:translate(-50%,-50%) rotate(-9deg) scale(2.6); }
    28%{ opacity:0.92; transform:translate(-50%,-50%) rotate(-9deg) scale(0.92); }
    42%{ opacity:0.92; transform:translate(-50%,-50%) rotate(-9deg) scale(1.05); }
    58%{ opacity:0.88; transform:translate(-50%,-50%) rotate(-9deg) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) rotate(-9deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .ink-stamp{ display:none; }
  }
  .typing-cursor::after{
    content:"▌"; color:var(--ink); opacity:0.7; animation: blinkCursor 0.85s steps(1) infinite;
  }
  @keyframes blinkCursor{ 50%{ opacity:0; } }

  .user-menu-wrap{ position:relative; }
  .user-dropdown{
    position:absolute; top:38px; right:0; min-width:170px;
    background:var(--paper-light); border:1px solid var(--ink-soft); border-radius:6px;
    box-shadow: 0 6px 16px var(--shadow); overflow:hidden; z-index:30;
  }
  .user-dropdown.hidden{ display:none; }
  .user-dropdown button{
    display:block; width:100%; text-align:left; padding:13px 16px;
    background:none; border:none; border-bottom:1px solid var(--paper-dark);
    font-family:'Special Elite'; font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .user-dropdown button:last-child{ border-bottom:none; }
  .user-dropdown button:active{ background:var(--paper-dark); }
  .menu-trigger{ font-size:20px; padding:4px 10px; }

  .settings-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 4px; margin:6px 0 16px; border-top:1px dashed var(--paper-dark); border-bottom:1px dashed var(--paper-dark);
  }
  .settings-row-title{ font-family:'Special Elite'; font-size:12.5px; color:var(--ink); }
  .settings-row-sub{ font-family:'Lora'; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .toggle-switch{
    width:46px; height:26px; border-radius:14px; border:none; background:var(--paper-dark);
    position:relative; cursor:pointer; flex-shrink:0; transition:background .15s ease;
  }
  .toggle-switch::after{
    content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px var(--shadow); transition:left .15s ease;
  }
  .toggle-switch.on{ background:var(--map-teal); }
  .toggle-switch.on::after{ left:23px; }

  .ptr-indicator{
    position:fixed; top:10px; left:50%; z-index:55;
    width:38px; height:38px; border-radius:50%;
    background:var(--paper-light); border:1px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow:0 3px 8px var(--shadow);
    transform:translateX(-50%) scale(0) rotate(0deg);
    pointer-events:none;
  }
  .ptr-indicator.refreshing .ptr-icon{ animation: ptrSpin 0.8s linear infinite; }
  @keyframes ptrSpin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .ptr-indicator.refreshing .ptr-icon{ animation:none; }
  }

  .update-banner{
    position:fixed; top:0; left:0; right:0; z-index:60;
    background:var(--ink); color:var(--paper-light);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-family:'Special Elite'; font-size:12px;
    box-shadow:0 3px 8px var(--shadow);
    animation: fadeIn .25s ease;
  }
  .update-banner button{
    background:var(--stamp-red); color:var(--paper-light); border:none; border-radius:14px;
    padding:8px 14px; font-family:'Special Elite'; font-size:11.5px; cursor:pointer; white-space:nowrap;
  }
  .local-note{
    background:var(--paper-dark); border:1px solid var(--ink-soft); border-radius:4px;
    padding:10px 14px; font-family:'Special Elite'; font-size:11.5px; line-height:1.5;
    color:var(--ink-soft); margin-bottom:16px;
  }
  .empty-note{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
    font-family:'Caveat'; font-size:22px; border:2px dashed var(--paper-dark); border-radius:4px;
  }
  .section-title{display:flex; align-items:center; gap:10px; margin:22px 0 10px;}
  .section-title h2{font-size:22px;}
  .section-title::after{content:""; flex:1; height:1px; background: repeating-linear-gradient(90deg, var(--ink-soft) 0 4px, transparent 4px 8px);}

  .fab{
    position:fixed; right:20px; bottom:24px; z-index:5;
    width:56px; height:56px; border-radius:50%;
    background:var(--stamp-red); color:var(--paper-light); border:none;
    font-size:28px; box-shadow:0 4px 10px var(--shadow); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ transform: scale(0.94); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,15,8,0.45); z-index:20;
    display:flex; align-items:flex-end; justify-content:center; animation: fadeIn .2s ease;
  }
  .modal{
    background:var(--paper-light); width:100%; max-width:520px;
    border-radius:14px 14px 0 0; padding:22px 22px 26px;
    max-height:85vh; overflow-y:auto;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.3);
  }
  .modal h2{font-size:26px; margin-bottom:4px;}
  .modal .close-x{background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; padding:4px 6px;}
  .modal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .modal-nav .back-btn{ padding:6px 4px 6px 0; }
  .modal-wrap{position:relative;}

  .code-chip{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Special Elite'; background:var(--paper-dark); color:var(--ink);
    padding:6px 12px; border-radius:20px; font-size:13px; letter-spacing:2px; cursor:pointer;
  }

  /* ---- Book header ---- */
  .book-header{ padding:16px 20px 4px; }
  .book-header h1{font-size:34px; line-height:1.05;}
  .members-row{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;}

<div id="toast" class="toast"></div>

<script>
/* ---------------- Firebase (compartir diarios entre dispositivos) ----------------
   PASO A PASO para activarlo (gratis):
   1. Ve a https://console.firebase.google.com y crea un proyecto nuevo (nombre libre).
   2. En el menú lateral, entra en "Firestore Database" > "Crear base de datos".
      Elige modo "producción" y cualquier ubicación cercana.
   3. Dentro de Firestore, pestaña "Reglas", pega esto y publica:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /{document=**} { allow read, write: if true; }
          }
        }
      (Esto no tiene contraseñas de verdad, igual que el resto de la app —
       cualquiera con el enlace de tu app podría en teoría leer/escribir datos.
       Es aceptable para un diario familiar/de amigos, no para datos sensibles.)
   4. Vuelve a la página principal del proyecto > icono "</>" (Añadir app web).
      Dale un nombre y pulsa "Registrar app". Te mostrará un bloque "firebaseConfig".
   5. Copia esos valores AQUÍ ABAJO, entre las comillas: */
const firebaseConfig = {
  apiKey: "AIzaSyA92bNd7Ony0irtNcNqema40N9WeNcWRnc",
  authDomain: "bitacora-e6310.firebaseapp.com",
  projectId: "bitacora-e6310",
  storageBucket: "bitacora-e6310.firebasestorage.app",
  messagingSenderId: "429815504054",
  appId: "1:429815504054:web:5bc912ed54053b52c91a17",
  measurementId: "G-48XEK22Y6Y"
};
/* 6. Sube este archivo actualizado a GitHub reemplazando el anterior. Listo:
      cualquier dispositivo que abra la app verá los mismos diarios. */

let db = null;
let IS_FIRESTORE = false;
if(firebaseConfig.apiKey && firebaseConfig.projectId && typeof firebase !== 'undefined'){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    IS_FIRESTORE = true;
  }catch(e){ console.error('No se pudo iniciar Firebase', e); }
}

/* ---------------- storage helpers ----------------
   Dentro de Claude.ai, esta app usa window.storage (guardado en la nube,
   compartido entre dispositivos). Si se abre como app instalada fuera de
   Claude (PWA en el móvil), esa API no existe, así que se usa localStorage
   como respaldo para que la app nunca deje de funcionar. IS_CLOUD indica
   cuál de los dos modos está activo. */
const IS_CLOUD = (typeof window.storage !== 'undefined' && window.storage
  && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');

function lsKey(key, shared){ return 'bitacora:' + (shared ? 'shared:' : 'priv:') + key; }

async function sget(key, shared=false){
  if(IS_CLOUD){
    try{
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(lsKey(key, shared));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function sset(key, value, shared=false){
  if(IS_CLOUD){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
    catch(e){ console.error('storage set failed', e); return false; }
  }
  try{ localStorage.setItem(lsKey(key, shared), JSON.stringify(value)); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

function esc(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function reEscape(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
/* Resalta @menciones a viajeros reales del diario dentro de un texto ya escapado. */
function renderTextWithMentions(text, members){
  let html = esc(text);
  if(!members || !members.length) return html;
  const sorted = [...members].sort((a,b)=>b.length-a.length);
  for(const m of sorted){
    const token = '@' + reEscape(esc(m));
    const re = new RegExp(token + '(?!\\w)', 'gi');
    html = html.replace(re, (match)=>`<span class="mention">${match}</span>`);
  }
  return html;
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function genCode(){
  const chars = 'ACDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
const COVER_ICONS = ['🗺️','🧭','⛰️','🏝️','🚂','🎒','⛺','🌍'];
function coverFor(seed){
  let h=0; for(const ch of seed) h += ch.charCodeAt(0);
  return COVER_ICONS[h % COVER_ICONS.length];
}
function coverColor(seed){
  const colors = ['#33585A','#A3402C','#B5893F','#5C6B3F','#5A4A6B'];
  let h=0; for(const ch of seed) h += ch.charCodeAt(0)*3;
  return colors[h % colors.length];
}
function tiltFor(seed){
  let h=0; for(const ch of seed) h += ch.charCodeAt(0)*7;
  return ((h % 9) - 4) + 'deg'; // entre -4deg y 4deg, distinto por diario
}
function tiltYFor(seed){
  let h=0; for(const ch of seed) h += ch.charCodeAt(0)*11;
  return ((h % 7) - 3) + 'deg'; // ligero ángulo 3D, como si estuviera fotografiada
}
function initials(name){
  return (name||'?').trim().slice(0,2).toUpperCase();
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'});
}

/* ---------------- app state ---------------- */
let S = {
  user: null,
  view: 'loading',
  currentBook: null,   // full book object
  currentChapterId: null,
  entryTab: 'anecdote', // 'anecdote' | 'photo'
  menuOpen: false,
  justWrittenEntryId: null // entrada recién creada/editada: se anima como escritura a mano
};
// Caché en memoria: una vez que creamos o abrimos un diario, lo guardamos
// aquí para no depender de releerlo justo después de escribirlo (evita el
// hueco de "no lo veo en la estantería" si la lectura llega antes de que
// el guardado se haya propagado del todo).
let bookCache = {};

const app = document.getElementById('app');

/* ---- sesión: se guarda siempre en localStorage (propia del dispositivo,
   nunca falla por red) y, si hay nube, también ahí como respaldo extra ---- */
function saveSessionLocal(name){
  try{ localStorage.setItem('bitacora_session', JSON.stringify({name})); }catch(e){}
}
function readSessionLocal(){
  try{
    const raw = localStorage.getItem('bitacora_session');
    if(raw){ const v = JSON.parse(raw); if(v && v.name) return v.name; }
  }catch(e){}
  return null;
}
function clearSessionLocal(){
  try{ localStorage.removeItem('bitacora_session'); }catch(e){}
}

async function init(){
  let name = readSessionLocal();
  if(!name && IS_CLOUD){
    const cloudSession = await sget('session', false);
    if(cloudSession && cloudSession.name) name = cloudSession.name;
  }
  if(name){
    S.user = name;
    saveSessionLocal(name); // asegura que quede en ambos sitios
    S.view = 'books';
    history.replaceState({nav:true, view:'books'}, '');
    render();
  } else {
    S.view = 'login';
    history.replaceState({nav:true, view:'login'}, '');
    render();
  }
}

/* ---------------- data ops ---------------- */
async function loadBook(code){
  if(IS_FIRESTORE) return await fbLoadBook(code);
  const b = await sget('book:'+code, true);
  if(b) bookCache[code] = b;
  return b;
}
async function saveBook(book){
  // Solo se usa en modo local/nube-de-Claude. En modo Firestore cada acción
  // (crear capítulo, añadir entrada, etc.) escribe directamente su propio
  // documento, así que esta función no se usa entonces.
  book.updatedAt = new Date().toISOString();
  bookCache[book.code] = book;
  return await sset('book:'+book.code, book, true);
}
async function myBookCodes(){
  if(IS_FIRESTORE){
    try{
      const snap = await db.collection('books').where('members','array-contains',S.user).get();
      return snap.docs.map(d=>d.id);
    }catch(e){ console.error('myBookCodes (Firestore) error', e); return []; }
  }
  return (await sget('mybooks:'+S.user, false)) || [];
}
async function addMyBookCode(code){
  // En modo Firestore la lista de "mis diarios" se calcula directamente
  // consultando quién es miembro de cada diario, así que no hace falta
  // mantener esta lista aparte.
  if(IS_FIRESTORE) return;
  const list = await myBookCodes();
  if(!list.includes(code)){
    list.push(code);
    await sset('mybooks:'+S.user, list, false);
  }
}

/* ---- Firestore: carga completa de un diario (libro + capítulos + entradas) ---- */
/* Carga el diario para el ÍNDICE: título, miembros y lista de capítulos,
   pero SIN sus notas/fotos (eso es lo que hacía lenta la apertura del
   diario: se descargaban todas las fotos de todos los capítulos solo para
   mostrar el índice). Las notas de cada capítulo se piden aparte, solo
   cuando entras en esa página en concreto (ver fbLoadChapterEntries). */
async function fbLoadBook(code){
  try{
    const bookRef = db.collection('books').doc(code);
    const [bookSnap, chaptersSnap] = await Promise.all([
      bookRef.get(),
      bookRef.collection('chapters').orderBy('createdAt','asc').get()
    ]);
    if(!bookSnap.exists) return null;
    const book = bookSnap.data();
    book.code = code;
    book.chapters = chaptersSnap.docs.map(chDoc => {
      const chapter = chDoc.data();
      chapter.id = chDoc.id;
      if(!chapter.entries) chapter.entries = []; // se cargan bajo demanda
      return chapter;
    });
    bookCache[code] = book;
    return book;
  }catch(e){ console.error('fbLoadBook error', e); return null; }
}
/* ---- Firestore: versión ligera solo para la estantería (sin leer capítulos ni entradas) ---- */
async function fbLoadBookSummary(code){
  try{
    const snap = await db.collection('books').doc(code).get();
    if(!snap.exists) return null;
    const book = snap.data();
    book.code = code;
    book.chapters = new Array(book.chapterCount || 0); // solo para mostrar el conteo
    return book;
  }catch(e){ console.error('fbLoadBookSummary error', e); return null; }
}
/* Trae las notas/fotos de UN capítulo en concreto (bajo demanda) */
async function fbLoadChapterEntries(bookCode, chapterId){
  try{
    const entriesSnap = await db.collection('books').doc(bookCode)
      .collection('chapters').doc(chapterId).collection('entries')
      .orderBy('timestamp','asc').get();
    return entriesSnap.docs.map(d => ({ ...d.data(), id: d.id }));
  }catch(e){ console.error('fbLoadChapterEntries error', e); return null; }
}

/* ---------------------------------------------------------------------- */

/* ---------------- navigation ----------------
   Cada paso hacia delante queda registrado en el historial del navegador,
   así el botón "Volver" del móvil (o el gesto de deslizar) siempre lleva
   al paso anterior en vez de cerrar la app. */
let navigatingFromHistory = false;
function pushViewState(){
  if(navigatingFromHistory) return;
  history.pushState({
    nav:true, view:S.view,
    bookCode: S.currentBook ? S.currentBook.code : null,
    chapterId: S.currentChapterId || null
  }, '');
}

async function goBooks(){
  S.view = 'books';
  S.currentBook = null;
  S.currentChapterId = null;
  render();
  pushViewState();
}
async function openBook(code){
  const cached = bookCache[code];
  if(cached){
    // Lo mostramos al instante con lo que ya teníamos, y refrescamos
    // en segundo plano sin que el usuario tenga que esperar.
    S.currentBook = cached;
    S.currentChapterId = null;
    S.view = 'book';
    render();
    pushViewState();
    if(IS_FIRESTORE){
      loadBook(code).then(fresh=>{
        if(!fresh || S.view !== 'book' || !S.currentBook || S.currentBook.code !== code) return;
        // conservamos las notas de capítulos que ya tuviéramos cargadas en memoria
        const loadedEntries = {};
        (S.currentBook.chapters||[]).forEach(ch=>{ if(ch.entries && ch.entries.length) loadedEntries[ch.id] = ch.entries; });
        fresh.chapters.forEach(ch=>{ if(loadedEntries[ch.id] && (!ch.entries || !ch.entries.length)) ch.entries = loadedEntries[ch.id]; });
        S.currentBook = fresh;
        bookCache[code] = fresh;
        render();
      }).catch(()=>{});
    }
    return;
  }
  S.view = 'loading'; render();
  try{
    const book = await loadBook(code);
    if(!book){ toast('No se encontró ese diario'); S.view='books'; render(); return; }
    S.currentBook = book;
    S.currentChapterId = null;
    S.view = 'book';
    render();
    pushViewState();
  }catch(e){
    console.error(e);
    toast('No se pudo abrir el diario. Inténtalo de nuevo.');
    S.view = 'books'; render();
  }
}
async function openChapter(chapterId){
  S.currentChapterId = chapterId;
  S.entryTab = 'anecdote';

  if(IS_FIRESTORE){
    const book = S.currentBook;
    const chapter = book.chapters.find(c=>c.id===chapterId);
    if(chapter && chapter.entries && chapter.entries.length > 0){
      // Ya la habíamos visto antes: se muestra al instante y se refresca detrás.
      S.view = 'chapter';
      render();
      pushViewState();
      fbLoadChapterEntries(book.code, chapterId).then(entries=>{
        if(entries && S.currentChapterId === chapterId){
          chapter.entries = entries;
          if(S.view === 'chapter') render();
        }
      }).catch(()=>{});
      return;
    }
    // Primera vez que se abre esta página: solo pedimos SUS notas, no las
    // de todo el diario (así se abre rápido aunque el diario tenga muchas fotos).
    if(chapter){
      const entries = await fbLoadChapterEntries(book.code, chapterId);
      if(entries) chapter.entries = entries;
    }
  }

  S.view = 'chapter';
  render();
  pushViewState();
}
/* Envuelve la navegación con un efecto de "pasar página" */
function pageTurnTransition(navigateFn){
  app.classList.add('turning-out');
  setTimeout(async ()=>{
    await navigateFn();
    app.classList.remove('turning-out');
    void app.offsetWidth; // reinicia la animación de entrada
    app.classList.add('turning-in');
    setTimeout(()=> app.classList.remove('turning-in'), 300);
  }, 210);
}
function openChapterAnimated(chapterId){
  pageTurnTransition(()=> openChapter(chapterId));
}
function openBookAnimated(code){
  pageTurnTransition(()=> openBook(code));
}

window.addEventListener('popstate', (e)=>{
  // Si hay un modal abierto, el retroceso lo cierra primero (ver showModal/closeModal).
  const m = document.getElementById('modalBackdrop');
  if(m){ m.remove(); return; }

  navigatingFromHistory = true;
  const st = e.state;
  let nextView, nextBookCode, nextChapterId;
  if(!st || !st.nav){
    nextView = S.user ? 'books' : 'login';
    nextBookCode = null; nextChapterId = null;
  } else if(st.view === 'login' || !S.user){
    nextView = 'login'; nextBookCode = null; nextChapterId = null;
  } else if(st.view === 'chapter' && st.bookCode){
    nextView = 'chapter'; nextBookCode = st.bookCode; nextChapterId = st.chapterId;
  } else if(st.view === 'book' && st.bookCode){
    nextView = 'book'; nextBookCode = st.bookCode; nextChapterId = null;
  } else {
    nextView = 'books'; nextBookCode = null; nextChapterId = null;
  }

  // Si este cambio de historial no altera realmente dónde estamos (p. ej. es
  // solo el "consumo" del paso que dejó un modal al cerrarse), no repintamos:
  // evita un re-render redundante que interrumpiría animaciones en curso
  // (como la del texto escribiéndose a mano).
  const currentBookCode = S.currentBook ? S.currentBook.code : null;
  const isSameState = nextView === S.view && nextBookCode === currentBookCode && nextChapterId === S.currentChapterId;
  if(isSameState){ navigatingFromHistory = false; return; }

  S.view = nextView;
  S.currentChapterId = nextChapterId;
  if(nextView === 'chapter' || nextView === 'book'){
    S.currentBook = bookCache[nextBookCode] || S.currentBook;
  } else {
    S.currentBook = null;
  }
  render();
  navigatingFromHistory = false;
});

/* ---------------- pulsación larga para eliminar ----------------
   Mantener pulsado 3s un diario, un viaje o una anécdota/foto abre un
   menú de confirmación para eliminarlo. */
const LONG_PRESS_MS = 2000;
const MOVE_CANCEL_PX = 10;
let longPressTimer = null;
let longPressFired = false;
let lpStartX = 0, lpStartY = 0;

function startLongPress(e, kind, id){
  cancelLongPress();
  longPressFired = false;
  lpStartX = e.clientX; lpStartY = e.clientY;
  const el = e.currentTarget;
  el.classList.add('pressing');
  longPressTimer = setTimeout(()=>{
    longPressFired = true;
    el.classList.remove('pressing');
    if(navigator.vibrate) navigator.vibrate(20);
    if(kind==='book') askDeleteBook(id);
    else if(kind==='chapter-list') askDeleteChapter(id, false);
    else if(kind==='chapter-view') askDeleteChapter(id, true);
    else if(kind==='entry') askEntryActions(id);
  }, LONG_PRESS_MS);
}
function moveLongPress(e){
  if(!longPressTimer) return;
  if(Math.abs(e.clientX-lpStartX) > MOVE_CANCEL_PX || Math.abs(e.clientY-lpStartY) > MOVE_CANCEL_PX) cancelLongPress(e);
}
function cancelLongPress(e){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
  if(e && e.currentTarget) e.currentTarget.classList.remove('pressing');
  else document.querySelectorAll('.pressing').forEach(el=>el.classList.remove('pressing'));
}
function guardedClick(fn){
  if(longPressFired){ longPressFired = false; return; }
  fn();
}
/* Efecto de "sacar el libro de la estantería" antes de abrirlo */
function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function showStamp(text){
  if(prefersReducedMotion()) return;
  const el = document.createElement('div');
  el.className = 'ink-stamp';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 900);
}

/* Anima el texto de una anécdota recién escrita o editada, letra a letra,
   como si se estuviera escribiendo a mano. Al terminar, aplica el resaltado
   de menciones (@nombre) que se había pospuesto durante la animación. */
function typewriterReveal(elId, plainText, finalHtml, speed){
  const el = document.getElementById(elId);
  if(!el) return;
  if(prefersReducedMotion() || !plainText){ el.innerHTML = finalHtml; return; }
  speed = speed || Math.max(10, Math.min(28, 900 / plainText.length));
  let i = 0;
  el.textContent = '';
  el.classList.add('typing-cursor');
  const timer = setInterval(()=>{
    i++;
    el.textContent = plainText.slice(0, i);
    if(i >= plainText.length){
      clearInterval(timer);
      el.classList.remove('typing-cursor');
      el.innerHTML = finalHtml;
    }
  }, speed);
}

/* Efecto de "sacar el libro de la estantería" y abrir su tapa en 3D */
function pullBookAndOpen(code, el){
  if(longPressFired){ longPressFired = false; return; }
  const color = getComputedStyle(el).backgroundColor;
  const title = el.querySelector('.spine-title')?.textContent || '';
  const icon = el.querySelector('.spine-icon')?.textContent || '📔';

  if(prefersReducedMotion()){ openBook(code); return; }

  el.classList.add('pulling');
  setTimeout(()=> showBookCoverOpen(color, title, icon, ()=> openBook(code)), 220);
}

function showBookCoverOpen(color, title, icon, afterNavigate){
  const overlay = document.createElement('div');
  overlay.className = 'book-cover-overlay';
  overlay.innerHTML = `
    <div class="book-cover-face leather-texture" style="background-color:${color};">
      <div class="cover-corner tl"></div>
      <div class="cover-icon">${icon}</div>
      <div class="cover-title">${esc(title)}</div>
      <div class="cover-line"></div>
      <div class="cover-corner br"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  const face = overlay.querySelector('.book-cover-face');
  void face.offsetWidth; // asegura que la transición se aplique al añadir 'opening'

  requestAnimationFrame(async ()=>{
    await afterNavigate(); // la vista de destino ya está lista debajo de la tapa
    requestAnimationFrame(()=>{
      overlay.classList.add('opening');
      setTimeout(()=> overlay.remove(), 560);
    });
  });
}

function askDeleteBook(code){
  const b = bookCache[code];
  showModal(`
    <h2>¿Eliminar este diario?</h2>
    <p class="delete-warn">Se borrará "${esc(b ? b.title : 'este diario')}" para todos los que lo tengan, con todos sus viajes, anécdotas y fotos. Esta acción no se puede deshacer.</p>
    <div class="btn-row">

      <button class="btn delete-btn" onclick="confirmDeleteBook('${code}')">Eliminar diario</button>

  `);
}
async function confirmDeleteBook(code){
  closeModal();
  try{
    if(IS_FIRESTORE){
      const chaptersSnap = await db.collection('books').doc(code).collection('chapters').get();
      for(const chDoc of chaptersSnap.docs){
        const entriesSnap = await db.collection('books').doc(code)
          .collection('chapters').doc(chDoc.id).collection('entries').get();
        for(const eDoc of entriesSnap.docs) await eDoc.ref.delete();
        await chDoc.ref.delete();
      }
      await db.collection('books').doc(code).delete();
    } else {
      if(IS_CLOUD){ try{ await window.storage.delete('book:'+code, true); }catch(e){} }
      try{ localStorage.removeItem(lsKey('book:'+code, true)); }catch(e){}
      const list = await myBookCodes();
      const idx = list.indexOf(code);
      if(idx>-1){ list.splice(idx,1); await sset('mybooks:'+S.user, list, false); }
    }
    delete bookCache[code];
    toast('Diario eliminado');
  }catch(e){
    console.error(e);
    toast('No se pudo eliminar. Inténtalo de nuevo.');
  }
  render(); // ya estamos en la estantería, solo se refresca la lista
}

function askDeleteChapter(chapterId, fromDetailView){

  const chapter = book.chapters.find(c=>c.id===chapterId);
  showModal(`

    </div>
  `);
}
async function confirmDeleteChapter(chapterId, fromDetailView){
  const book = S.currentBook;
  const idx = book.chapters.findIndex(c=>c.id===chapterId);
  if(idx===-1){ closeModal(); return; }
  try{
    if(IS_FIRESTORE){
      const entriesSnap = await db.collection('books').doc(book.code)
        .collection('chapters').doc(chapterId).collection('entries').get();
      for(const eDoc of entriesSnap.docs) await eDoc.ref.delete();
      await db.collection('books').doc(book.code).collection('chapters').doc(chapterId).delete();
      await db.collection('books').doc(book.code).update({
        chapterCount: firebase.firestore.FieldValue.increment(-1),
        updatedAt: new Date().toISOString()
      });
      book.chapters.splice(idx, 1);
    } else {
      book.chapters.splice(idx, 1);
      const ok = await saveBook(book);
      if(!ok) throw new Error('saveBook failed');
    }
  }catch(e){
    console.error(e);
    closeModal();
    toast('No se pudo eliminar. Inténtalo de nuevo.');
    return;
  }
  if(fromDetailView){
    // Estábamos viendo esa página: vamos a la anterior del mismo diario,
    // o a la estantería general si ya no quedan páginas.
    closeModal({keepHistory:true});
    toast('Viaje eliminado');
    if(book.chapters.length === 0){
      await goBooks();
    } else {
      const target = book.chapters[Math.max(0, idx-1)];
      await openChapter(target.id);
    }
  } else {
    closeModal();
    toast('Viaje eliminado');
    render(); // seguimos en la vista del diario, con la lista ya actualizada
  }
}

      code, title,
      createdBy: S.user,
      createdAt: new Date().toISOString(),
      members: [S.user],
      chapters: [],
      chapterCount: 0
    };

        title, createdBy: S.user, createdAt: book.createdAt, updatedAt: book.createdAt,
        members: [S.user], chapterCount: 0
      });

      await addMyBookCode(code);

          members: firebase.firestore.FieldValue.arrayUnion(S.user)
        });

async function addEntry(data){
  try{
    const book = S.currentBook;
    const chapter = book.chapters.find(c=>c.id===S.currentChapterId);
    const entry = { id: uid(), author: S.user, timestamp: new Date().toISOString(), ...data };
    if(IS_FIRESTORE){
      await db.collection('books').doc(book.code).collection('chapters').doc(chapter.id)
        .collection('entries').doc(entry.id).set(entry);
      await db.collection('books').doc(book.code).collection('chapters').doc(chapter.id)
        .update({ entryCount: firebase.firestore.FieldValue.increment(1) });
      await db.collection('books').doc(book.code).update({ updatedAt: new Date().toISOString() });
      chapter.entries.push(entry);
      chapter.entryCount = (chapter.entryCount || 0) + 1;
      S.justWrittenEntryId = entry.text ? entry.id : null;
      closeModal();
      render();
    } else {
      chapter.entries.push(entry);
      S.justWrittenEntryId = entry.text ? entry.id : null;
      const approxSize = JSON.stringify(book).length;
      const ok = await saveBook(book);
      if(!ok) throw new Error('saveBook failed');
      closeModal();
      render();
      if(approxSize > 4200000){
        toast('Este diario casi no tiene espacio. Prueba a crear otro para las próximas fotos.');
      }
    }
  }catch(e){
    console.error(e);
    toast('No se pudo guardar. El diario podría estar lleno de fotos: prueba con otro capítulo o diario.');
  }
}

async function updateEntry(entryId, data){
  try{
    const book = S.currentBook;
    const chapter = book.chapters.find(c=>c.id===S.currentChapterId);
    const entry = chapter.entries.find(e=>e.id===entryId);
    if(!entry) throw new Error('entry not found');
    const updated = {
      id: entry.id, author: entry.author, timestamp: entry.timestamp,
      editedAt: new Date().toISOString(), ...data
    };
    if(IS_FIRESTORE){
      // Se sobreescribe el documento entero (set, no update) para que los campos
      // quitados durante la edición (p.ej. si eliminas la foto) también desaparezcan.
      await db.collection('books').doc(book.code).collection('chapters').doc(chapter.id)
        .collection('entries').doc(entryId).set(updated);
      await db.collection('books').doc(book.code).update({ updatedAt: new Date().toISOString() });
    }
    const idx = chapter.entries.findIndex(e=>e.id===entryId);
    chapter.entries[idx] = updated;
    if(!IS_FIRESTORE){
      const ok = await saveBook(book);
      if(!ok) throw new Error('saveBook failed');
    }
    S.editingEntryId = null;
    S.pendingPhotoDataUrl = null;
    S.pendingPhotoDate = null;
    S.justWrittenEntryId = updated.text ? updated.id : null;
    closeModal();
    render();
    toast('Entrada actualizada');
  }catch(e){
    console.error(e);
    toast('No se pudo guardar el cambio. Inténtalo de nuevo.');
  }
}

/* ---------------- modal helper ---------------- */
function showModal(html, opts={}){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'modalBackdrop';
  wrap.onclick = (e)=>{ if(e.target===wrap) closeModal(); };
  const onBack = opts.onBack ? opts.onBack : 'closeModal()';
  wrap.innerHTML = `<div class="modal modal-wrap">
    <div class="modal-nav">
      <button class="back-btn" onclick="${onBack}">‹ Volver</button>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    ${html}
  </div>`;
  document.body.appendChild(wrap);
  history.pushState({modal:true}, '');
}
function closeModal(opts={}){
  const m = document.getElementById('modalBackdrop');
  if(m) m.remove();
  // Cuando cerramos el modal para navegar inmediatamente a otra vista
  // (crear/unirse a diario), no usamos history.back(): en su lugar la
  // navegación siguiente registra su propio paso, evitando que ambas
  // operaciones de historial se pisen entre sí.
  if(opts.keepHistory) return;
  if(history.state && history.state.modal) history.back();
}

/* Navega a la página (capítulo) anterior/siguiente en orden cronológico,
   como si se pasaran las hojas del mismo libro. */
function goAdjacentChapter(direction){
  const book = S.currentBook;
  const idx = book.chapters.findIndex(c=>c.id===S.currentChapterId);
  if(idx===-1) return;
  const targetIdx = idx + direction;
  if(targetIdx < 0 || targetIdx >= book.chapters.length) return;
  openChapterAnimated(book.chapters[targetIdx].id);
}

/* Deslizar el dedo sobre la cabecera del capítulo pasa a la página siguiente/anterior */
let swipeStartX = 0, swipeStartY = 0, swipeTracking = false;
function chapterSwipeStart(e){ swipeStartX = e.clientX; swipeStartY = e.clientY; swipeTracking = true; }
function chapterSwipeEnd(e){
  if(!swipeTracking) return;
  swipeTracking = false;
  const dx = e.clientX - swipeStartX, dy = e.clientY - swipeStartY;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    goAdjacentChapter(dx < 0 ? 1 : -1); // deslizar a la izquierda = página siguiente
  }
}

/* ---------------- @menciones ---------------- */
function findMentionTrigger(text, cursor){
  const upTo = text.slice(0, cursor);
  const at = upTo.lastIndexOf('@');
  if(at === -1) return null;
  if(at > 0 && !/\s/.test(upTo[at-1])) return null; // el @ debe empezar palabra
  const query = upTo.slice(at+1);
  if(query.includes('\n')) return null;
  return { at, query };
}
function handleMentionInput(e){
  const el = e.target;
  const box = document.getElementById('mentionSuggestions');
  if(!box) return;
  const trig = S.currentBook ? findMentionTrigger(el.value, el.selectionStart) : null;
  if(!trig){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const q = trig.query.toLowerCase();
  const matches = S.currentBook.members.filter(m =>
    m.toLowerCase() !== S.user.toLowerCase() && m.toLowerCase().startsWith(q)
  );
  if(matches.length === 0){ box.classList.add('hidden'); box.innerHTML=''; return; }
  box.innerHTML = matches.map(m => `<button type="button" class="mention-item" data-name="${esc(m)}">@${esc(m)}</button>`).join('');
  box.onmousedown = (ev)=>{
    const btn = ev.target.closest('.mention-item');
    if(!btn) return;
    ev.preventDefault();
    insertMentionInto(el.id, btn.dataset.name, trig.at);
  };
  box.classList.remove('hidden');
}
function insertMentionInto(elId, name, atIndex){
  const el = document.getElementById(elId);
  const cursor = el.selectionStart;
  const before = el.value.slice(0, atIndex);
  const after = el.value.slice(cursor);
  const inserted = '@'+name+' ';
  el.value = before + inserted + after;
  const newCursor = (before+inserted).length;
  el.focus();
  el.setSelectionRange(newCursor, newCursor);
  const box = document.getElementById('mentionSuggestions');
  box.classList.add('hidden');
  box.innerHTML = '';
}
function hideMentionsSoon(){

}

/* Lee el archivo elegido (cámara o galería), lo reduce de tamaño y calidad
   para que quepa cómodamente en el almacenamiento del diario, y lo deja
   listo como vista previa. */
function loadImageFromFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
function drawToDataUrl(img, maxDim, quality){
  let w = img.width, h = img.height;
  if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
  else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}
async function compressImage(file){
  const img = await loadImageFromFile(file);
  const steps = [
    {maxDim:1280, quality:0.72},
    {maxDim:1000, quality:0.6},
    {maxDim:800,  quality:0.5},
    {maxDim:600,  quality:0.45}
  ];
  let dataUrl = drawToDataUrl(img, steps[0].maxDim, steps[0].quality);
  for(const step of steps){
    dataUrl = drawToDataUrl(img, step.maxDim, step.quality);
    if(dataUrl.length < 700000) break; // deja margen dentro del límite de espacio del diario
  }
  return dataUrl;
}
async function handlePhotoSelect(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = ''; // permite volver a elegir el mismo archivo si hace falta
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Elige un archivo de imagen'); return; }
  const wrap = document.getElementById('photoPreviewWrap');
  wrap.innerHTML = `<div class="photo-processing">Procesando foto…</div>`;
  try{
    const dataUrl = await compressImage(file);
    S.pendingPhotoDataUrl = dataUrl;
    if(!S.pendingPhotoDate) S.pendingPhotoDate = new Date().toISOString().slice(0,10);
    wrap.innerHTML = renderPhotoPreviewBlock();
    const label = document.querySelector('#entryFields .field-label');
    if(label) label.textContent = 'Tu anécdota (opcional)';
  }catch(e){
    console.error(e);
    wrap.innerHTML = '';
    toast('No se pudo procesar la foto. Prueba con otra.');
  }
}

function submitEntry(){
  const text = document.getElementById('entryText').value.trim();
  if(!text && !S.pendingPhotoDataUrl){
    toast('Escribe algo o añade una foto');
    return;
  }
  const data = {};
  if(text) data.text = text;
  if(S.pendingPhotoDataUrl){
    data.imageUrl = S.pendingPhotoDataUrl;
    if(S.pendingPhotoDate) data.photoDate = S.pendingPhotoDate;
  }
  if(S.editingEntryId){
    updateEntry(S.editingEntryId, data);
  } else {
    addEntry(data);
  }
}

/* ---------------- actualizaciones automáticas ---------------- */
function getAutoUpdatePref(){
  try{ return localStorage.getItem('bitacora_auto_update') !== 'false'; } // activado por defecto
  catch(e){ return true; }
}
function setAutoUpdatePref(value){
  try{ localStorage.setItem('bitacora_auto_update', value ? 'true' : 'false'); }catch(e){}
}

let __swReg = null;
let __reloadingForUpdate = false;

function initServiceWorker(){
  if(!('serviceWorker' in navigator)) return;

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      __swReg = reg;

      // Si ya hay una versión esperando desde antes de abrir la app ahora mismo
      if(reg.waiting) handleUpdateFound(reg);

      reg.addEventListener('updatefound', () => {
        const installing = reg.installing;
        if(!installing) return;
        installing.addEventListener('statechange', () => {
          if(installing.state === 'installed' && navigator.serviceWorker.controller){
            handleUpdateFound(reg);
          }
        });
      });
    }).catch(err => console.log('SW registration failed', err));

    // Cuando el nuevo service worker toma el control, recargamos una vez.
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(__reloadingForUpdate) return;
      __reloadingForUpdate = true;
      window.location.reload();
    });

    // Cada vez que el usuario vuelve a la app (la reabre o cambia de pestaña
    // y regresa), comprobamos si hay una versión nueva en el servidor.
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible' && __swReg) __swReg.update().catch(()=>{});
    });
  });
}

function handleUpdateFound(reg){
  if(getAutoUpdatePref()){
    reg.waiting?.postMessage({ type: 'SKIP_WAITING' });
  } else {
    showUpdateBanner();
  }
}
function showUpdateBanner(){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.className = 'update-banner';
  bar.innerHTML = `
    <span>📖 Hay una versión nueva del cuaderno</span>
    <button onclick="applyUpdate()">Actualizar ahora</button>
  `;
  document.body.appendChild(bar);
}
function applyUpdate(){
  if(__swReg && __swReg.waiting) __swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
  document.getElementById('updateBanner')?.remove();
}

/* ---------------- pull-to-refresh personalizado ----------------
   Desactivamos el gesto nativo del navegador (que recargaba toda la app y
   te devolvía a la pantalla inicial) y lo sustituimos por uno propio que
   simplemente refresca los datos de la pantalla en la que ya estás. */
const PTR_THRESHOLD = 68;
let ptrStartY = 0, ptrTracking = false, ptrRefreshing = false;

function ptrPointerDown(e){
  if(ptrRefreshing) return;
  if(window.scrollY > 0) return; // solo si estamos arriba del todo de la página
  if(document.getElementById('modalBackdrop')) return; // no interferir con modales abiertos
  if(!['books','book','chapter'].includes(S.view)) return;
  ptrStartY = e.clientY;
  ptrTracking = true;
}
function ptrPointerMove(e){
  if(!ptrTracking || ptrRefreshing) return;
  const dy = e.clientY - ptrStartY;
  if(dy > 0 && window.scrollY === 0){
    const progress = Math.min(1, dy / PTR_THRESHOLD);
    const el = document.getElementById('ptrIndicator');
    el.style.transform = `translateX(-50%) scale(${progress}) rotate(${dy*1.8}deg)`;
  }
}
function ptrPointerEnd(e){
  if(!ptrTracking) return;
  ptrTracking = false;
  if(ptrRefreshing) return;
  const dy = e.clientY - ptrStartY;
  const el = document.getElementById('ptrIndicator');
  if(dy > PTR_THRESHOLD && window.scrollY === 0){
    doRefreshCurrentView();
  } else {
    el.style.transform = 'translateX(-50%) scale(0) rotate(0deg)';
  }
}
document.addEventListener('pointerdown', ptrPointerDown);
document.addEventListener('pointermove', ptrPointerMove);
document.addEventListener('pointerup', ptrPointerEnd);
document.addEventListener('pointercancel', ()=>{
  ptrTracking = false;
  if(!ptrRefreshing) document.getElementById('ptrIndicator').style.transform = 'translateX(-50%) scale(0) rotate(0deg)';
});

async function doRefreshCurrentView(){
  ptrRefreshing = true;
  const el = document.getElementById('ptrIndicator');
  el.classList.add('refreshing');
  el.style.transform = 'translateX(-50%) scale(1) rotate(0deg)';
  try{
    if(S.view === 'books'){
      await render(); // renderBooks vuelve a consultar la lista de diarios
    } else if(S.view === 'book' && S.currentBook){
      const fresh = await loadBook(S.currentBook.code);
      if(fresh) S.currentBook = fresh;
      render(); // seguimos en la vista del diario, solo se actualiza el índice
    } else if(S.view === 'chapter' && S.currentBook){
      const chapter = S.currentBook.chapters.find(c=>c.id===S.currentChapterId);
      if(IS_FIRESTORE && chapter){
        const entries = await fbLoadChapterEntries(S.currentBook.code, chapter.id);
        if(entries){ chapter.entries = entries; chapter.entryCount = entries.length; }
      } else {
        const fresh = await loadBook(S.currentBook.code);
        if(fresh) S.currentBook = fresh;
      }
      render(); // seguimos en la misma página del capítulo, solo se actualiza
    }
  }catch(e){
    console.error(e);
    toast('No se pudo actualizar. Inténtalo de nuevo.');
  }
  el.classList.remove('refreshing');
  el.style.transform = 'translateX(-50%) scale(0) rotate(0deg)';
  ptrRefreshing = false;
}

initServiceWorker();

init();
</script>
